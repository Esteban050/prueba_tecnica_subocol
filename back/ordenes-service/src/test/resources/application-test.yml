spring:
  datasource:
    url: jdbc:h2:mem:ordenes_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  rabbitmq:
    exchange: taller.exchange
    routing-key-estado: orden.estado.cambiado
    routing-key-cerrada: orden.cerrada
