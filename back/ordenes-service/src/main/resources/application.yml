server:
  port: 8081

spring:
  application:
    name: ordenes-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ordenes_db}
    username: ${SPRING_DATASOURCE_USERNAME:ordenes_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ordenes_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: taller.exchange
    routing-key-estado: orden.estado.cambiado
    routing-key-cerrada: orden.cerrada
