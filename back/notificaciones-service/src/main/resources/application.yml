server:
  port: 8083

spring:
  application:
    name: notificaciones-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notificaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:notificaciones_user}
    password: ${SPRING_DATASOURCE_PASSWORD:notificaciones_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: taller.exchange
    queue-citas: notificaciones.citas.queue
    routing-key-citas: cita.#
