spring:
  datasource:
    url: jdbc:h2:mem:notificaciones_test_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  rabbitmq:
    exchange: taller.exchange
    queue-citas: notificaciones.citas.queue
    routing-key-citas: cita.#
