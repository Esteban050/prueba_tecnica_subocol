server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para microservicio Órdenes
    location /api/ordenes/ {
        proxy_pass http://ordenes-service:8081/api/ordenes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/clientes/ {
        proxy_pass http://ordenes-service:8081/api/clientes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/vehiculos/ {
        proxy_pass http://ordenes-service:8081/api/vehiculos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para microservicio Agenda
    location /api/agenda/ {
        proxy_pass http://agenda-service:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para microservicio Notificaciones
    location /api/notificaciones/ {
        proxy_pass http://notificaciones-service:8083/api/notificaciones/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
